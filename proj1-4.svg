<svg width="280" height="265" viewBox="0 0 280 265" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="265" fill="#ffffff" rx="5" stroke="#9FE1CB" stroke-width="1"/>
  <rect width="280" height="5" fill="#0F6E56" rx="5"/>
  <rect y="4" width="280" height="1" fill="#0F6E56"/>

  <rect x="16" y="18" width="94" height="17" fill="#E1F5EE" rx="2"/>
  <text x="22" y="30" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#0F6E56" letter-spacing="1">SUPPLY CHAIN</text>

  <text x="16" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2C2C2A">Nike vs Adidas —</text>
  <text x="16" y="83" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2C2C2A">Factory Intelligence</text>

  <line x1="16" y1="95" x2="264" y2="95" stroke="#E1F5EE" stroke-width="1"/>

  <text x="16" y="113" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5E5A">Mapped 42 factories across 11 countries</text>
  <text x="16" y="129" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5E5A">using PostgreSQL. Ran HHI concentration</text>
  <text x="16" y="145" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5E5A">index to quantify production risk — Nike</text>
  <text x="16" y="161" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5E5A">scores 0.18 vs Adidas 0.24. Nike is more</text>
  <text x="16" y="177" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5E5A">geographically diversified by design.</text>

  <rect x="16" y="188" width="2.5" height="42" fill="#1D9E75"/>
  <text x="26" y="201" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">Adidas keeps German factories at a cost</text>
  <text x="26" y="216" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">premium. Nike has zero EU production.</text>
  <text x="26" y="231" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">Not an accident — deliberate divergence.</text>

  <rect x="16" y="245" width="66" height="14" fill="#F1EFE8" rx="2"/>
  <text x="20" y="256" font-family="'Courier New', Courier, monospace" font-size="9" fill="#5F5E5A">PostgreSQL</text>
  <rect x="88" y="245" width="44" height="14" fill="#F1EFE8" rx="2"/>
  <text x="92" y="256" font-family="'Courier New', Courier, monospace" font-size="9" fill="#5F5E5A">Tableau</text>
  <rect x="138" y="245" width="32" height="14" fill="#F1EFE8" rx="2"/>
  <text x="142" y="256" font-family="'Courier New', Courier, monospace" font-size="9" fill="#5F5E5A">OODA</text>
  <rect x="176" y="245" width="26" height="14" fill="#F1EFE8" rx="2"/>
  <text x="180" y="256" font-family="'Courier New', Courier, monospace" font-size="9" fill="#5F5E5A">HHI</text>
</svg>
