<svg width="280" height="260" viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="280" height="260" fill="#ffffff" rx="5" stroke="#9FE1CB" stroke-width="1"/>
  <rect width="280" height="5" fill="#1D9E75" rx="5"/>
  <rect y="4" width="280" height="1" fill="#1D9E75"/>

  <rect x="16" y="18" width="120" height="17" fill="#E1F5EE" rx="2"/>
  <text x="22" y="30" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#0F6E56" letter-spacing="1">RECOMMENDER SYSTEM</text>

  <text x="16" y="62" font-family="Georgia, serif" font-size="16" fill="#2C2C2A">Head Barista —</text>
  <text x="16" y="81" font-family="Georgia, serif" font-size="16" fill="#2C2C2A">Coffee Intelligence</text>

  <line x1="16" y1="92" x2="264" y2="92" stroke="#E1F5EE" stroke-width="1"/>

  <text x="16" y="110" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">Built from 3 years behind the counter.</text>
  <text x="16" y="126" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">Scraped &amp; cleaned 500+ bean profiles,</text>
  <text x="16" y="142" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">applied NLP on tasting notes, then built</text>
  <text x="16" y="158" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">a content-based recommender. Covers</text>
  <text x="16" y="174" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">origin, roast, and flavor affinity.</text>

  <rect x="16" y="184" width="2.5" height="36" fill="#1D9E75"/>
  <text x="26" y="197" font-family="Arial, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">Best recommenders aren't built by</text>
  <text x="26" y="211" font-family="Arial, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">engineers — they're built by people</text>
  <text x="26" y="225" font-family="Arial, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">who actually worked the domain.</text>

  <rect x="16" y="240" width="40" height="14" fill="#F1EFE8" rx="2"/>
  <text x="20" y="251" font-family="Courier New, monospace" font-size="9" fill="#5F5E5A">Python</text>
  <rect x="62" y="240" width="26" height="14" fill="#F1EFE8" rx="2"/>
  <text x="66" y="251" font-family="Courier New, monospace" font-size="9" fill="#5F5E5A">NLP</text>
  <rect x="94" y="240" width="54" height="14" fill="#F1EFE8" rx="2"/>
  <text x="98" y="251" font-family="Courier New, monospace" font-size="9" fill="#5F5E5A">Scraping</text>
  <rect x="154" y="240" width="56" height="14" fill="#F1EFE8" rx="2"/>
  <text x="158" y="251" font-family="Courier New, monospace" font-size="9" fill="#5F5E5A">Pandas</text>
</svg>
