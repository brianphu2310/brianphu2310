<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>

    <form id="new-task-form" class="new-task">
      <input
        id="new-task-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        aria-label="New task"
      />
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter is-active" data-filter="all">All</button>
      <button type="button" class="filter" data-filter="active">Active</button>
      <button type="button" class="filter" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">Nothing here yet.</p>

    <footer class="summary">
      <span id="count">0 tasks left</span>
      <button type="button" id="clear-completed">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
