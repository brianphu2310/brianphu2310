<svg width="280" height="200" viewBox="0 0 280 200" xmlns="http://www.w3.org/2000/svg">
  <!-- card bg -->
  <rect width="280" height="200" fill="#ffffff" rx="4" stroke="#9FE1CB" stroke-width="1"/>
  <!-- top accent -->
  <rect width="280" height="4" fill="#0F6E56" rx="4"/>
  <rect y="4" width="280" height="0" fill="#0F6E56"/>

  <!-- tag -->
  <rect x="16" y="20" width="90" height="18" fill="#E1F5EE" rx="2"/>
  <text x="24" y="32" font-family="'Sora', Arial, sans-serif" font-size="9" font-weight="600" fill="#0F6E56" letter-spacing="1">SUPPLY CHAIN</text>

  <!-- title -->
  <text x="16" y="62" font-family="Georgia, serif" font-size="15" fill="#2C2C2A">Nike vs Adidas</text>
  <text x="16" y="80" font-family="Georgia, serif" font-size="15" fill="#2C2C2A">Factory Intelligence</text>

  <!-- desc -->
  <text x="16" y="104" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">42 factories · 11 countries · HHI</text>
  <text x="16" y="120" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">concentration analysis · strategic</text>
  <text x="16" y="136" font-family="Arial, sans-serif" font-size="10.5" fill="#5F5E5A">divergence mapping</text>

  <!-- finding -->
  <rect x="16" y="148" width="2" height="28" fill="#1D9E75"/>
  <text x="24" y="160" font-family="Arial, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">Adidas: German factories (cost</text>
  <text x="24" y="173" font-family="Arial, sans-serif" font-size="9.5" font-style="italic" fill="#0F6E56">premium). Nike: zero EU production.</text>

  <!-- stack -->
  <rect x="16" y="183" width="60" height="13" fill="#F1EFE8" rx="2"/>
  <text x="20" y="193" font-family="'Courier New', monospace" font-size="9" fill="#5F5E5A">PostgreSQL</text>
  <rect x="82" y="183" width="40" height="13" fill="#F1EFE8" rx="2"/>
  <text x="87" y="193" font-family="'Courier New', monospace" font-size="9" fill="#5F5E5A">Tableau</text>
  <rect x="128" y="183" width="30" height="13" fill="#F1EFE8" rx="2"/>
  <text x="132" y="193" font-family="'Courier New', monospace" font-size="9" fill="#5F5E5A">OODA</text>
</svg>
