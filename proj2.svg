  <rect width="280" height="4" fill="#1D9E75" rx="4"/>

  <rect x="16" y="20" width="108" height="18" fill="#E1F5EE" rx="2"/>
  <text x="24" y="32" font-family="'Sora', Arial, sans-serif" font-size="9" font-weight="600" fill="#0F6E56" letter-spacing="1">RECOMMENDER SYS</text>

